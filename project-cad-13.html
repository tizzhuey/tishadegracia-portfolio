<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Pool Cabana — Tisha Anne De Gracia</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F4F0; --ink:#1B2430; --ink-soft:#3C4552; --steel:#707880;
    --line:#C9C6BD; --blue:#2C4A73; --blue-dim:#EDF1F6;
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
  img{max-width:100%;display:block}
  a{color:var(--blue)}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px}
  header{border-bottom:1px solid var(--line);padding:20px 0}
  .back{text-decoration:none;font-family:var(--mono);font-size:.85rem;color:var(--ink-soft)}

  .title-block{padding:48px 0 32px;border-bottom:1px solid var(--line)}
  .ptype{font-family:var(--mono);font-size:.8rem;color:var(--blue);margin:0 0 10px}
  h1{font-size:2rem;margin:0 0 20px}
  .meta-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;font-family:var(--mono);font-size:.78rem;border-top:1px solid var(--line);padding-top:18px;max-width:400px}
  .meta-strip div span{display:block;color:var(--steel);margin-bottom:4px}

  section{padding:40px 0;border-bottom:1px solid var(--line)}
  section:last-of-type{border-bottom:none}
  h2{font-size:1.2rem;margin:0 0 16px}
  p{color:var(--ink-soft);margin:0 0 14px;max-width:70ch}

  .box{border:1px solid var(--line);padding:20px;max-width:480px}
  .box.mine{border-color:var(--blue)}
  .box h3{font-size:.9rem;margin:0 0 10px;font-family:var(--mono)}
  .box ul{margin:0;padding-left:18px;color:var(--ink-soft);font-size:.92rem}

  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .gallery .ph{aspect-ratio:4/3;background:var(--blue-dim);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.72rem;color:var(--steel);text-align:center;padding:8px}
  .gallery img{aspect-ratio:4/3;object-fit:cover;border:1px solid var(--line)}

  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .tools span{font-family:var(--mono);font-size:.75rem;border:1px solid var(--line);padding:5px 10px}

  @media (max-width:700px){
    .meta-strip{max-width:none}
    .box{max-width:none}
    .gallery{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<header><div class="wrap"><a class="back" href="index.html#cad">&larr; Back to portfolio</a></div></header>

<div class="title-block wrap">
  <p class="ptype">SKETCHUP</p>
  <h1>C Pool Cabana</h1>
  <div class="meta-strip">
    <div><span>LOCATION</span>Butong, Taal</div>
    <div><span>PROJECT TYPE</span>Residential</div>
  </div>
</div>

<section class="wrap">
  <h2>My Involvement</h2>
  <p>Created detailed 3D models to visually communicate the proposed design and layout.</p>
</section>

<section class="wrap">
  <h2>Documentation &amp; Tools</h2>
  <div class="tools">
    <span>SketchUp</span>
  </div>
</section>

<section class="wrap">
  <h2>Project Photos / Drawings</h2>
  <div class="gallery">
    <img src="assets/cad-13-photo1.jpg" alt="C Pool Cabana photo 1">
    <img src="assets/cad-13-photo2.jpg" alt="C Pool Cabana photo 2">
    <img src="assets/cad-13-photo3.jpg" alt="C Pool Cabana photo 3">
  </div>
</section>

</body>
</html>
